[project]
name = "vectorflow"
version = "0.1.0"
description = "Multi-tenant document ingestion & hybrid search engine"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.2.0",
    "pydantic_settings",
    "sqlalchemy[asyncio]>2.0.28",
    "asyncpg>=0.29.0",
    "pgvector>=0.2.5",
    "alembic>=1.13.0",
    "redis>=5.0.3",
    "arq>=0.25.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.5",
    "mypy>=1.9.0",
    "ruff>=0.3.0",
]